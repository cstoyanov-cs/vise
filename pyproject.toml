[project]
name = "vise"
version = "0.1.0"
description = "A keyboard driven browser with tabs in a tree (QtWebEngine)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-only" }
authors = [{ name = "vise fork maintainer" }]
keywords = ["browser", "keyboard", "vim", "qtwebengine"]
classifiers = [
  "Environment :: X11 Applications :: Qt",
  "Intended Audience :: End Users/Desktop",
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: Browsers",
]
dependencies = [
  "PyQt6>=6.5",
  "PyQt6-WebEngine>=6.5",
  "apsw>=3.42",
  "PyYAML>=6.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "pytest-mock>=3.12",
  "ruff>=0.6",
  "pre-commit>=4",
]
# Note: rapydscript-ng is a JS-based build tool, NOT a Python package,
# so it cannot live in [project.optional-dependencies]. Install it
# separately — see README "Building the client JavaScript".

[project.scripts]
vise = "vise.main:main"

[project.urls]
Upstream = "https://github.com/kovidgoyal/vise"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vise"]
exclude = [
  "tests*",
  "client*",
  "*.pyj",
  ".build-cache*",
  "=template.py",
  "build",
  ".coverage",
]

[tool.hatch.envs.default]
dependencies = ["pytest", "pytest-cov", "ruff"]

[tool.hatch.envs.default.scripts]
test = "pytest {args:tests/unit}"
lint = "ruff check {args:.}"
format = "ruff format {args:.}"
build-js = "sh build"

# ── pytest ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests/unit"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
filterwarnings = [
  "ignore::DeprecationWarning",
  "ignore::PendingDeprecationWarning",
]

# ── coverage ────────────────────────────────────────────────────────────
[tool.coverage.run]
source = ["vise"]
branch = true
omit = ["tests/*", "*/__pycache__/*", "*/site-packages/*"]

[tool.coverage.report]
show_missing = true
exclude_lines = [
  "pragma: no cover",
  "def __repr__",
  "raise NotImplementedError",
  "if __name__ == .__main__.:",
]

# ── ruff ────────────────────────────────────────────────────────────────
# Equivalent to the old flake8 config: pycodestyle (E/W) + pyflakes (F)
# with the same ignore rules. Stricter rule families (UP, SIM, ...) can be
# enabled incrementally in a follow-up commit.
[tool.ruff]
line-length = 160
target-version = "py311"
extend-exclude = ["=template.py"]

[tool.ruff.lint]
select = ["E", "W", "F"]
ignore = ["E741"]
